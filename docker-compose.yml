name: nawa

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    <<: *restart
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./apps/api
      additional_contexts:
        seed: ./seed
    image: nawa-api:dev
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *restart
    build:
      context: ./apps/api
      additional_contexts:
        seed: ./seed
    image: nawa-api:dev
    env_file: .env
    environment:
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *restart
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}

  ollama-pull:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull bge-m3 && ollama pull ${OLLAMA_CHAT_MODEL:?set in .env}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  langfuse-db:
    <<: *restart
    profiles: ["observability"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in .env}
    volumes: [langfuse_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-redis:
    <<: *restart
    profiles: ["observability"]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?set in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${LANGFUSE_REDIS_PASSWORD} ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD}

  clickhouse:
    <<: *restart
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env}
    volumes: [clickhouse_data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # No healthcheck: the mc binary is not guaranteed in the minio image; Langfuse retries S3 connections.
  # minio/minio is no longer published on Docker Hub or Quay; this is the image Langfuse's own
  # compose file uses.
  minio:
    <<: *restart
    profiles: ["observability"]
    image: cgr.dev/chainguard/minio:latest
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?set in .env}
    volumes: [minio_data:/data]

  langfuse-worker:
    <<: *restart
    profiles: ["observability"]
    image: langfuse/langfuse-worker:3
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_started}
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

  langfuse-web:
    <<: *restart
    profiles: ["observability"]
    image: langfuse/langfuse:3
    depends_on:
      - langfuse-worker
    ports: ["127.0.0.1:3100:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      # Headless bootstrap: on first start Langfuse creates this org, project, API key pair and
      # first user. The API reads the same key pair from .env (LANGFUSE_PUBLIC_KEY/SECRET_KEY).
      # Left empty, nothing is created and the sign-up page works as usual.
      LANGFUSE_INIT_ORG_ID: nawa
      LANGFUSE_INIT_ORG_NAME: NAWA
      LANGFUSE_INIT_PROJECT_ID: nawa-ai
      LANGFUSE_INIT_PROJECT_NAME: NAWA.AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  langfuse_db_data:
  clickhouse_data:
  minio_data:
