[project]
name = "noesantara-seed"
version = "0.1.0"
description = "Deterministic synthetic demo data for Resto Noesantara (fictional)."
requires-python = ">=3.12"
dependencies = ["asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesantara_seed"]
