[project]
name = "nawa-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "redis>=5.2",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "alembic>=1.20.1",
  "email-validator>=2.3.0",
  "litellm>=1.108.1",
  "pyyaml>=6.0.3",
  "langfuse>=4.7,<5",
  "pgvector>=0.5.1",
  "pypdf>=7.0.0",
  "python-docx>=1.2.0",
  "filetype>=1.2.0",
  "arq>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "fakeredis>=2.40.0",
  "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nawa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../seed"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nawa"]
mypy_path = "../../seed"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "nawa"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Business modules are independent"
type = "independence"
modules = [
  "nawa.workspace",
  "nawa.knowledge",
  "nawa.data",
  "nawa.agents",
  "nawa.automation",
  "nawa.evaluation",
]

[[tool.importlinter.contracts]]
name = "Core does not import business modules"
type = "forbidden"
source_modules = ["nawa.core"]
forbidden_modules = [
  "nawa.workspace",
  "nawa.knowledge",
  "nawa.data",
  "nawa.agents",
  "nawa.automation",
  "nawa.evaluation",
  "nawa.intelligence",
]
