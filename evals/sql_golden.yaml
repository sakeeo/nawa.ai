# Golden dataset for the Text-to-SQL evaluation (`make eval-sql`).
# Written by hand against the locked demo database (seed/noesantara_seed, seed 42, year 2025).
# "Today" for relative phrases is 2025-12-31, the newest order (the semantic layer's time_anchor).
# Every reference_sql must pass the SQL Guard under seed/noesantara_semantic.yaml and return
# at least one row (except items tagged empty_ok). `ordered: true` means row order matters.
# Top-N items were checked for ties at the cut-off, so the expected rows are unambiguous.
