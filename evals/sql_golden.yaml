  difficulty: medium
  question: Berapa rata-rata nilai satu pesanan (omzet dibagi jumlah pesanan)?
  reference_sql: |
    SELECT SUM(order_items.quantity * order_items.unit_price) / COUNT(DISTINCT orders.id)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
  ordered: false
  tags: [metric_aov, join]
- id: M15
  difficulty: medium
  question: Bahan baku apa di outlet mana yang stoknya di bawah batas minimum pada bulan Agustus 2025?
  reference_sql: |
    SELECT ingredients.name, outlets.name
    FROM ingredient_stock
    JOIN ingredients ON ingredient_stock.ingredient_id = ingredients.id
    JOIN outlets ON ingredient_stock.outlet_id = outlets.id
    WHERE ingredient_stock.month = DATE '2025-08-01'
      AND ingredient_stock.stock_qty < ingredient_stock.min_stock
  ordered: false
  tags: [join, period, filter, anomaly]
- id: M16
  difficulty: medium
  question: Berapa stok daging sapi di outlet Bandung pada bulan Agustus 2025?
  reference_sql: |
    SELECT ingredient_stock.stock_qty
    FROM ingredient_stock
    JOIN ingredients ON ingredient_stock.ingredient_id = ingredients.id
    JOIN outlets ON ingredient_stock.outlet_id = outlets.id
    WHERE ingredients.name = 'Daging Sapi' AND outlets.name = 'Bandung'
      AND ingredient_stock.month = DATE '2025-08-01'
  ordered: false
  tags: [join, period, filter, anomaly]
- id: M17
  difficulty: medium
  question: Berapa jumlah pelanggan terdaftar di tiap outlet?
  reference_sql: |
    SELECT outlets.name, COUNT(*)
    FROM customers
    JOIN outlets ON customers.outlet_id = outlets.id
    GROUP BY outlets.name
  ordered: false
  tags: [count, join, group]
- id: M18
  difficulty: medium
  question: Menu apa saja di kategori Olahan Sapi, lengkap dengan harga jualnya?
  reference_sql: |
    SELECT name, price FROM menu_items WHERE category = 'Olahan Sapi'
  ordered: false
  tags: [select, filter]
- id: M19
  difficulty: medium
  question: Berapa porsi yang terjual untuk tiap kategori menu pada bulan Desember 2025?
  reference_sql: |
    SELECT menu_items.category, SUM(order_items.quantity)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    WHERE orders.created_at >= DATE '2025-12-01' AND orders.created_at < DATE '2026-01-01'
    GROUP BY menu_items.category
  ordered: false
  tags: [sum, join, period, group]
- id: M20
  difficulty: medium
  question: Berapa laba kotor (omzet dikurangi food cost) sepanjang tahun?
  reference_sql: |
    SELECT SUM(order_items.quantity * (order_items.unit_price - menu_items.food_cost))
    FROM order_items
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
  ordered: false
  tags: [metric_gross_profit, join]
# ---------------------------------------------------------------- hard (10)
- id: H01
  difficulty: hard
  question: Outlet mana dengan penjualan terendah pada bulan Agustus 2025?
  reference_sql: |
    SELECT outlets.name
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-08-01' AND orders.created_at < DATE '2025-09-01'
    GROUP BY outlets.name
    ORDER BY SUM(order_items.quantity * order_items.unit_price) ASC
    LIMIT 1
  ordered: true
  tags: [metric_revenue, join, period, top1, anomaly]
- id: H02
  difficulty: hard
  question: Berapa selisih omzet antara bulan Desember dan November 2025 (Desember dikurangi November)?
  reference_sql: |
    SELECT SUM(CASE WHEN orders.created_at >= DATE '2025-12-01'
                    THEN order_items.quantity * order_items.unit_price ELSE 0 END)
         - SUM(CASE WHEN orders.created_at < DATE '2025-12-01'
                    THEN order_items.quantity * order_items.unit_price ELSE 0 END)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-11-01' AND orders.created_at < DATE '2026-01-01'
  ordered: false
  tags: [metric_revenue, join, period, comparison]
- id: H03
  difficulty: hard
  question: Berapa persen omzet delivery dibanding total omzet sepanjang 2025?
  reference_sql: |
    SELECT 100.0 * SUM(CASE WHEN orders.channel = 'delivery'
                            THEN order_items.quantity * order_items.unit_price ELSE 0 END)
           / SUM(order_items.quantity * order_items.unit_price)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
  ordered: false
  tags: [metric_revenue, join, share]
- id: H04
  difficulty: hard
  question: Outlet mana yang omzet delivery-nya paling tinggi sepanjang 2025?
  reference_sql: |
    SELECT outlets.name
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.channel = 'delivery'
    GROUP BY outlets.name
    ORDER BY SUM(order_items.quantity * order_items.unit_price) DESC
    LIMIT 1
  ordered: true
  tags: [metric_revenue, join, filter, top1]
- id: H05
  difficulty: hard
  question: Untuk tiap outlet, berapa selisih omzet bulan Agustus dibanding Juli 2025 (Agustus dikurangi Juli)?
  reference_sql: |
    SELECT outlets.name,
           SUM(CASE WHEN orders.created_at >= DATE '2025-08-01'
                    THEN order_items.quantity * order_items.unit_price ELSE 0 END)
         - SUM(CASE WHEN orders.created_at < DATE '2025-08-01'
                    THEN order_items.quantity * order_items.unit_price ELSE 0 END) AS selisih
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-07-01' AND orders.created_at < DATE '2025-09-01'
    GROUP BY outlets.name
  ordered: false
  tags: [metric_revenue, join, period, comparison, group]
- id: H06
  difficulty: hard
  question: Menu olahan sapi apa yang paling laku (jumlah porsi) di outlet Bandung pada bulan Juli 2025?
  reference_sql: |
    SELECT menu_items.name
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    WHERE menu_items.category = 'Olahan Sapi' AND outlets.name = 'Bandung'
      AND orders.created_at >= DATE '2025-07-01' AND orders.created_at < DATE '2025-08-01'
    GROUP BY menu_items.name
    ORDER BY SUM(order_items.quantity) DESC, menu_items.name
    LIMIT 1
  ordered: true
  tags: [join, period, filter, top1]
- id: H07
  difficulty: hard
  question: Berapa jumlah menu olahan sapi yang terjual (minimal satu porsi) di outlet Bandung pada bulan Agustus 2025?
  reference_sql: |
    SELECT COUNT(DISTINCT menu_items.id)
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    WHERE menu_items.category = 'Olahan Sapi' AND outlets.name = 'Bandung'
      AND orders.created_at >= DATE '2025-08-01' AND orders.created_at < DATE '2025-09-01'
  ordered: false
  tags: [count_distinct, join, period, filter, anomaly]
- id: H08
  difficulty: hard
  question: Outlet mana yang pernah mencatat omzet bulanan terendah sepanjang 2025, dan berapa omzetnya?
  reference_sql: |
    WITH monthly AS (
      SELECT outlets.name AS outlet, DATE_TRUNC('month', orders.created_at) AS month,
             SUM(order_items.quantity * order_items.unit_price) AS revenue
      FROM orders
      JOIN outlets ON orders.outlet_id = outlets.id
      JOIN order_items ON order_items.order_id = orders.id
      GROUP BY outlets.name, DATE_TRUNC('month', orders.created_at)
    )
    SELECT outlet, revenue FROM monthly ORDER BY revenue ASC LIMIT 1
  ordered: true
  tags: [metric_revenue, cte, top1, anomaly]
- id: H09
  difficulty: hard
  question: Berapa rata-rata omzet bulanan tiap outlet selama 2025?
  reference_sql: |
    WITH monthly AS (
      SELECT outlets.name AS outlet, DATE_TRUNC('month', orders.created_at) AS month,
             SUM(order_items.quantity * order_items.unit_price) AS revenue
      FROM orders
      JOIN outlets ON orders.outlet_id = outlets.id
      JOIN order_items ON order_items.order_id = orders.id
      GROUP BY outlets.name, DATE_TRUNC('month', orders.created_at)
    )
    SELECT outlet, AVG(revenue) FROM monthly GROUP BY outlet
  ordered: false
  tags: [metric_revenue, cte, group]
- id: H10
  difficulty: hard
  question: Untuk tiap outlet, berapa persen biaya Gaji dibanding omzet sepanjang 2025?
  reference_sql: |
    WITH revenue AS (
      SELECT orders.outlet_id AS outlet_id,
             SUM(order_items.quantity * order_items.unit_price) AS total
      FROM orders
      JOIN order_items ON order_items.order_id = orders.id
      GROUP BY orders.outlet_id
    ), salary AS (
      SELECT outlet_id, SUM(amount) AS total FROM expenses WHERE category = 'Gaji' GROUP BY outlet_id
    )
    SELECT outlets.name, 100.0 * salary.total / revenue.total
    FROM outlets
    JOIN revenue ON revenue.outlet_id = outlets.id
    JOIN salary ON salary.outlet_id = outlets.id
  ordered: false
  tags: [metric_revenue, cte, join, share]
