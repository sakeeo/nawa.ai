  difficulty: medium
  question: Berapa total biaya operasional tiap outlet sepanjang tahun?
  reference_sql: |
    SELECT outlets.name, SUM(expenses.amount)
    FROM expenses
    JOIN outlets ON expenses.outlet_id = outlets.id
