# ---------------------------------------------------------------- medium (20)
- id: M01
  difficulty: medium
  question: Berapa omzet tiap outlet sepanjang tahun?
  reference_sql: |
    SELECT outlets.name, SUM(order_items.quantity * order_items.unit_price) AS revenue
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    GROUP BY outlets.name
  ordered: false
  tags: [metric_revenue, join, group]
- id: M02
  difficulty: medium
  question: Berapa omzet pada bulan Agustus 2025?
  reference_sql: |
    SELECT SUM(order_items.quantity * order_items.unit_price)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-08-01' AND orders.created_at < DATE '2025-09-01'
  ordered: false
  tags: [metric_revenue, period]
- id: M03
  difficulty: medium
  question: Berapa total penjualan bulan ini?
  reference_sql: |
    SELECT SUM(order_items.quantity * order_items.unit_price)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-12-01' AND orders.created_at < DATE '2026-01-01'
  ordered: false
  tags: [metric_revenue, period, relative_time]
- id: M04
  difficulty: medium
  question: Berapa omzet bulan lalu?
  reference_sql: |
    SELECT SUM(order_items.quantity * order_items.unit_price)
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    WHERE orders.created_at >= DATE '2025-11-01' AND orders.created_at < DATE '2025-12-01'
  ordered: false
  tags: [metric_revenue, period, relative_time]
- id: M05
  difficulty: medium
  question: Berapa jumlah pesanan untuk setiap channel penjualan?
  reference_sql: SELECT channel, COUNT(*) FROM orders GROUP BY channel
  ordered: false
  tags: [count, group]
- id: M06
  difficulty: medium
  question: Berapa omzet per channel penjualan (dine-in, takeaway, delivery)?
  reference_sql: |
    SELECT orders.channel, SUM(order_items.quantity * order_items.unit_price) AS revenue
    FROM orders
    JOIN order_items ON order_items.order_id = orders.id
    GROUP BY orders.channel
  ordered: false
  tags: [metric_revenue, join, group]
- id: M07
  difficulty: medium
  question: Berapa omzet untuk setiap kategori menu?
  reference_sql: |
    SELECT menu_items.category, SUM(order_items.quantity * order_items.unit_price) AS revenue
    FROM order_items
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    GROUP BY menu_items.category
  ordered: false
  tags: [metric_revenue, join, group]
- id: M08
  difficulty: medium
  question: Menu apa yang paling banyak terjual dalam jumlah porsi?
  reference_sql: |
    SELECT menu_items.name, SUM(order_items.quantity) AS qty
    FROM order_items
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    GROUP BY menu_items.name
    ORDER BY qty DESC, menu_items.name
    LIMIT 1
  ordered: true
  tags: [top1, join, group]
- id: M09
  difficulty: medium
  question: Tampilkan 5 menu dengan omzet tertinggi beserta omzetnya.
  reference_sql: |
    SELECT menu_items.name, SUM(order_items.quantity * order_items.unit_price) AS revenue
    FROM order_items
    JOIN menu_items ON order_items.menu_item_id = menu_items.id
    GROUP BY menu_items.name
    ORDER BY revenue DESC, menu_items.name
    LIMIT 5
  ordered: true
  tags: [topn, metric_revenue, join]
- id: M10
  difficulty: medium
  question: Berapa omzet outlet Surabaya pada bulan Oktober 2025?
  reference_sql: |
    SELECT SUM(order_items.quantity * order_items.unit_price)
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    JOIN order_items ON order_items.order_id = orders.id
    WHERE outlets.name = 'Surabaya'
      AND orders.created_at >= DATE '2025-10-01' AND orders.created_at < DATE '2025-11-01'
  ordered: false
  tags: [metric_revenue, join, period, filter]
- id: M11
  difficulty: medium
  question: Berapa jumlah pesanan tiap outlet pada bulan Agustus 2025?
  reference_sql: |
    SELECT outlets.name, COUNT(*)
    FROM orders
    JOIN outlets ON orders.outlet_id = outlets.id
    WHERE orders.created_at >= DATE '2025-08-01' AND orders.created_at < DATE '2025-09-01'
    GROUP BY outlets.name
  ordered: false
  tags: [count, join, period, group]
- id: M12
  difficulty: medium
  question: Berapa total biaya untuk setiap kategori biaya?
  reference_sql: SELECT category, SUM(amount) FROM expenses GROUP BY category
  ordered: false
  tags: [sum, group]
